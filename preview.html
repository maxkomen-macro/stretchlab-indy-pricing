<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StretchLab Pricing — Indianapolis (priced set)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{ --pur:#7c3aed; --pur-soft:#ede9fe; --ink:#1e1b2e; --mut:#6b7280;
         --line:#e7e3f3; --bg:#faf9fe; --ok:#15803d; --ok-bg:#dcfce7;
         --warn:#b45309; --warn-bg:#fef3c7; --wait:#6b7280; --wait-bg:#eef0f3;
         --teal:#0e9f6e; --teal-bg:#d1fae5; --sl-row:#f6f2ff; }
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);background:var(--bg);padding:28px;padding-top:50px}
  .confid{position:fixed;top:0;left:0;right:0;z-index:1000;background:#7f1d1d;color:#fff;
    font-size:12px;font-weight:700;text-align:center;padding:7px 10px;letter-spacing:.03em}
  .wrap{max-width:1000px;margin:0 auto}
  .banner{background:var(--pur-soft);border:1px solid var(--line);color:#4c1d95;
    border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:22px}
  h1{font-size:22px;margin:0 0 2px} .sub{color:var(--mut);font-size:13px;margin-bottom:24px}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--pur);
    margin:30px 0 10px;border-bottom:2px solid var(--pur-soft);padding-bottom:6px}
  .note{color:var(--mut);font-size:12px;margin:-4px 0 10px}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
    border-radius:10px;overflow:hidden}
  th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line);font-size:14px}
  th{background:#fbfaff;color:var(--mut);font-weight:600;font-size:12px;
    text-transform:uppercase;letter-spacing:.04em}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .brand{font-weight:600}
  tr.sl td{background:var(--sl-row)}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
  .b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn)}
  .b-wait{background:var(--wait-bg);color:var(--wait)} .b-sl{background:var(--pur-soft);color:#5b21b6}
  .chip{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:5px;
    margin-left:5px;letter-spacing:.03em;text-transform:uppercase}
  .c-shared{background:#e0e7ff;color:#3730a3} .c-promo{background:#ffe4e6;color:#9f1239}
  .c-intro{background:#fff7ed;color:#9a3412}
  .cmp{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}
  .cmp-exact{background:var(--ok-bg);color:var(--ok)} .cmp-close{background:var(--warn-bg);color:var(--warn)}
  .cmp-caveat{background:var(--wait-bg);color:var(--wait)}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px;overflow:hidden}
  .card h3{margin:0;padding:11px 14px;font-size:14px;background:#fbfaff;border-bottom:1px solid var(--line)}
  .card h3 small{color:var(--mut);font-weight:400}
  .empty{color:var(--mut);padding:14px;font-size:13px}
  #map{height:440px;border-radius:10px;border:1px solid var(--line);z-index:0}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 2px 0}
  .legend .dot{display:inline-block;width:11px;height:11px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1px #cbd5e1;vertical-align:-1px;margin-right:5px}
</style>
</head>
<body>
<div class="confid">CONFIDENTIAL — local only. Do not share or screenshot: shows scraped-vs-corporate pricing variance.</div>
<div class="wrap" id="app">Loading… (run <code>python scraper.py</code> first to generate data/latest.js)</div>

<script src="data/latest.js"></script>
<script>
  const fmt = v => v==null ? "—" : "$"+Number(v).toFixed(2).replace(/\.00$/,"");
  const fmtm = v => v==null ? "—" : "$"+Number(v).toFixed(2)+"/min";
  const isSL = s => s.brand === "StretchLab";

  const statusBadge = (o) => {
    const s = o.status || "";
    let cls = "b-warn", txt = s;
    if(/^scraped$/.test(s)){ cls="b-ok"; txt="scraped"; }
    else if(/^retail_seed$/.test(s)){ cls="b-sl"; txt="retail seed"; }
    else if(/^ok$|verified/.test(s)){ cls="b-ok"; }
    else if(/seed_used|not_confirmed|booking|unmatched/.test(s)){ cls="b-warn"; }
    else if(/callin|review|wait|internal|fill/i.test(s)){ cls="b-wait"; }
    let badge = `<span class="badge ${cls}">${txt}</span>`;
    // CONFIDENTIAL — pricing position vs the corporate card (local-only view)
    const pos = o.pricing_position;
    if(pos==="above" || pos==="below"){
      const d = Number(o.deviation_delta);
      badge += ` <span class="badge b-warn" title="CONFIDENTIAL — listed vs corporate card">`
             + `${pos} ${d>=0?"+":""}${d.toFixed(0)}</span>`;
    }
    return badge;
  };
  const flagChips = (o) => {
    let h="";
    if(o.is_shared) h+=`<span class="chip c-shared">shared</span>`;
    if(o.is_promo)  h+=`<span class="chip c-promo">promo</span>`;
    if(o.is_intro)  h+=`<span class="chip c-intro">intro</span>`;
    return h;
  };
  const cmpBadge = (c) => c ? `<span class="cmp cmp-${c}">${c}</span>` : "—";

  function render(d){
    let h = `<div class="banner">Priced Indy set — ${d.studios.length} studios, normalized to a
      comparable ~${d.anchor_session_min}-min basis. StretchLab rows are internal/retail — keep local.</div>
      <h1>Competitive Pricing — ${d.market}</h1>
      <div class="sub">Snapshot ${d.snapshot_date} · headline anchor: standard single ~${d.anchor_session_min}-min session</div>`;

    // ── MAP ──
    h += `<h2>Map — priced studios</h2>
      <div id="map"></div>
      <div class="legend">
        <span><span class="dot" style="background:var(--pur)"></span>StretchLab</span>
        <span><span class="dot" style="background:var(--teal)"></span>Competitor</span>
        <span>Pin popup shows the headline single-session rate.</span>
      </div>`;

    // ── HEADLINE ANCHOR ──
    h += `<h2>Headline anchor — standard single ~${d.anchor_session_min}-min</h2>
      <div class="note">Cheapest standing single-session rate nearest ${d.anchor_session_min} min. Promotions,
      new-client intros and shared (S) rates are excluded. Comparability flags how close the session length is to ${d.anchor_session_min} min.</div>
      <table><thead><tr><th>Brand</th><th>Location</th><th>Offer</th>
      <th class="num">$/session</th><th class="num">$/min</th><th>Length</th><th>Comparable</th></tr></thead><tbody>`;
    d.studios.forEach(s=>{
      const a = s.headline_anchor;
      h += `<tr class="${isSL(s)?'sl':''}"><td class="brand">${s.brand}</td><td>${s.location}</td>
        <td>${a?a.offer_name:"—"}${a&&a.provenance?` <small style="color:var(--mut)">(imputed)</small>`:""}</td>
        <td class="num">${a?fmt(a.price_per_session):"—"}</td>
        <td class="num">${a?fmt(a.price_per_min):"—"}</td>
        <td>${a?a.session_min+" min":"—"}</td>
        <td>${a?cmpBadge(a.comparability):"—"}</td></tr>`;
    });
    h += `</tbody></table>`;

    // ── SECONDARY ANCHOR ──
    h += `<h2>Secondary anchor — best committed member rate</h2>
      <div class="note">Lowest $/min among standing memberships (shared rates excluded).</div>
      <table><thead><tr><th>Brand</th><th>Location</th><th>Best membership</th>
      <th class="num">$/min</th></tr></thead><tbody>`;
    d.studios.forEach(s=>{
      const a = s.secondary_anchor;
      h += `<tr class="${isSL(s)?'sl':''}"><td class="brand">${s.brand}</td><td>${s.location}</td>
        <td>${a?a.offer_name:"—"}</td>
        <td class="num">${a?fmtm(a.price_per_min):"—"}</td></tr>`;
    });
    h += `</tbody></table>`;

    // ── FULL INVENTORY ──
    h += `<h2>Full inventory</h2>`;
    d.studios.forEach(s=>{
      h += `<div class="card"><h3>${s.brand} — ${s.location}
        <small>· ${s.source.method}${s.lat==null?' · (no map pin)':''}</small></h3>`;
      const priced = s.offers.filter(o=>o.price!=null);
      if(!priced.length){ h += `<div class="empty">Awaiting data (${s.offers[0]?.status||"—"})</div>`; }
      else{
        h += `<table><tbody>`;
        priced.forEach(o=>{
          h += `<tr><td>${o.name} <small style="color:var(--mut)">${o.structure||""}</small>${flagChips(o)}</td>
            <td class="num">${fmt(o.price)}</td>
            <td class="num">${o.price_per_min!=null?fmt(o.price_per_min)+"/min":""}</td>
            <td>${statusBadge(o)}</td></tr>`;
        });
        h += `</tbody></table>`;
      }
      h += `</div>`;
    });

    document.getElementById("app").innerHTML = h;

    // ── init Leaflet after the #map div exists ──
    try{
      const map = L.map('map',{scrollWheelZoom:true}).setView([39.87,-86.15],10);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
      const pts=[];
      d.studios.forEach(s=>{
        if(s.lat==null||s.lng==null) return;
        const sl = isSL(s), col = sl?'#7c3aed':'#0e9f6e';
        const a = s.headline_anchor;
        const line = a ? `${fmt(a.price_per_session)} · ${fmt(a.price_per_min)}/min · ${a.session_min}min (${a.comparability})`
                       : 'no single anchor';
        L.circleMarker([s.lat,s.lng],{radius:sl?9:7,color:'#fff',weight:2,fillColor:col,fillOpacity:.95})
          .addTo(map)
          .bindTooltip(`${s.brand} — ${s.location}`,{direction:'top'})
          .bindPopup(`<b>${s.brand} — ${s.location}</b><br>${line}<br><small>${s.address||''}</small>`);
        pts.push([s.lat,s.lng]);
      });
      if(pts.length) map.fitBounds(pts,{padding:[45,45]});
    }catch(e){ console.error('map init failed', e); }
  }
  if(window.PRICING_DATA) render(window.PRICING_DATA);
  else document.getElementById("app").innerHTML =
    'No data. Run <code>python scraper.py</code> to generate <code>data/latest.js</code>.';
</script>
</body>
</html>
